name: Sync results

on:
  schedule:
    # Every 10 minutes during the tournament (11 June - 19 July 2026).
    # GitHub delays scheduled runs by 20-60 min under load, so a tight
    # schedule is what actually lands near the 30-min mark in practice.
    - cron: '*/10 * 11-30 6 *'
    - cron: '*/10 * 1-19 7 *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fotbolls-vm.vercel.app/api/cron/sync
